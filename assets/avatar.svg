<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="200" cy="200" r="170" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#borderGrad)" stroke-width="4" filter="url(#glow)" opacity="0.8" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Geometric Tech Grid Background -->
  <g opacity="0.15" stroke="#818cf8" stroke-width="1">
    <line x1="80" y1="120" x2="320" y2="120" />
    <line x1="80" y1="200" x2="320" y2="200" />
    <line x1="80" y1="280" x2="320" y2="280" />
    <line x1="120" y1="80" x2="120" y2="320" />
    <line x1="200" y1="80" x2="200" y2="320" />
    <line x1="280" y1="80" x2="280" y2="320" />
  </g>

  <!-- Hexagon Accent -->
  <polygon points="200,90 295,145 295,255 200,310 105,255 105,145" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Initials Badge "AB" -->
  <text x="200" y="222" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="88" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">AB</text>

  <!-- Subtitle Tag -->
  <rect x="130" y="255" width="140" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />
  <text x="200" y="272" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="1.5">SOFTWARE ENG</text>

  <!-- Online Pulse Dot -->
  <circle cx="280" cy="120" r="8" fill="#10b981" />
  <circle cx="280" cy="120" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" />
</svg>
