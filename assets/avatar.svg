<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="200" cy="200" r="170" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#borderGrad)" stroke-width="3" filter="url(#glow)" opacity="0.8" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Robotic Cyber Grid Circuit Lines -->
  <g opacity="0.22" stroke="#00f2fe" stroke-width="1.2">
    <line x1="80" y1="120" x2="320" y2="120" />
    <line x1="80" y1="200" x2="320" y2="200" />
    <line x1="80" y1="280" x2="320" y2="280" />
    <line x1="120" y1="80" x2="120" y2="320" />
    <line x1="200" y1="80" x2="200" y2="320" />
    <line x1="280" y1="80" x2="280" y2="320" />
  </g>

  <!-- Robotic Hexagonal Frame with Nodes -->
  <polygon points="200,85 300,142 300,258 200,315 100,258 100,142" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6" />
  <circle cx="200" cy="85" r="4" fill="#00f2fe" />
  <circle cx="300" cy="142" r="4" fill="#6366f1" />
  <circle cx="300" cy="258" r="4" fill="#a855f7" />
  <circle cx="200" cy="315" r="4" fill="#00f2fe" />
  <circle cx="100" cy="258" r="4" fill="#6366f1" />
  <circle cx="100" cy="142" r="4" fill="#a855f7" />

  <!-- Initials Badge "AB" -->
  <text x="200" y="222" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="88" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">AB</text>

  <!-- Robotic Telemetry Subtitle Tag -->
  <rect x="110" y="255" width="180" height="26" rx="6" fill="#0a1226" stroke="#00f2fe" stroke-width="1.2" opacity="0.95" />
  <text x="200" y="272" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="1.5">NST HYD // B.TECH</text>

  <!-- Online Cyber Status Pulse Dot -->
  <circle cx="280" cy="118" r="7" fill="#10b981" />
  <circle cx="280" cy="118" r="14" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.5" />
</svg>
